version: 2

models:

  - name: fct_song_popularity
    description: "Aggregated song-level listening and engagement metrics."

    columns:
      - name: SONG_ID
        description: "Unique identifier of the song."
        data_tests:
          - not_null
          - unique

      - name: TOTAL_PLAYS
        description: "Number of play events for the song."

      - name: TOTAL_LIKES
        description: "Number of like events for the song."

      - name: TOTAL_SKIPS
        description: "Number of skip events for the song."

      - name: UNIQUE_LISTENERS
        description: "Number of unique users who generated events for the song."


  - name: fct_artist_performance
    description: "Aggregated listening and engagement metrics at artist level."

    columns:
      - name: ARTIST_ID
        description: "Unique identifier of the artist."
        data_tests:
          - not_null
          - unique

      - name: TOTAL_PLAYS
        description: "Number of play events for the artist."

      - name: TOTAL_LIKES
        description: "Number of like events for the artist."

      - name: UNIQUE_LISTENERS
        description: "Number of unique listeners for the artist."


  - name: fct_genre_trends
    description: "Daily listening activity aggregated by music genre."

    columns:
      - name: EVENT_DATE
        description: "Date on which the music event occurred."
        data_tests:
          - not_null

      - name: GENRE
        description: "Music genre associated with the event."
        data_tests:
          - not_null


  - name: fct_user_listening
    description: "Aggregated listening behavior for each user."

    columns:
      - name: USER_ID
        description: "Unique identifier of the user."
        data_tests:
          - not_null
          - unique

      - name: TOTAL_PLAYS
        description: "Total number of play events generated by the user."

      - name: UNIQUE_SONGS_LISTENED
        description: "Number of distinct songs listened to by the user."


  - name: fct_daily_active_listeners
    description: "Daily number of unique users who generated play events."

    columns:
      - name: EVENT_DATE
        description: "Date of activity."
        data_tests:
          - not_null
          - unique

      - name: DAILY_ACTIVE_LISTENERS
        description: "Number of unique users who played music on the date."